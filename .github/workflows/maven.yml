# 超星考试系统 - 集成测试工作流
# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven - 集成测试

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:  # 允许手动触发

jobs:
  # 用户注册功能测试
  test-user-registration:
    name: 用户注册功能测试
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chaoxing
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: 等待MySQL就绪
      run: |
        for i in {1..30}; do
          if mysqladmin ping -h"127.0.0.1" -P3307 -uroot -proot --silent; then
            echo "MySQL is ready!"
            break
          fi
          echo "Waiting for MySQL... ($i/30)"
          sleep 2
        done
        
    - name: 初始化数据库
      run: |
        mysql -h127.0.0.1 -P3307 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS chaoxing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
        mysql -h127.0.0.1 -P3307 -uroot -proot -e "SHOW DATABASES;"
    
    - name: 构建项目
      run: mvn -B clean compile --file backend/pom.xml
    
    - name: 运行用户注册功能测试
      run: mvn test -Dtest=UserRegistrationIntegrationTest --file backend/pom.xml
      
    - name: 上传测试报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: user-registration-test-report
        path: backend/target/surefire-reports/
        retention-days: 30

  # 用户登录功能测试（示例，可以后续添加）
  # test-user-login:
  #   name: 用户登录功能测试
  #   runs-on: ubuntu-latest
  #   needs: test-user-registration
  #   steps:
  #     - name: 检出代码
  #       uses: actions/checkout@v4
  #     # ... 其他步骤

  # 汇总测试结果
  test-summary:
    name: 测试结果汇总
    runs-on: ubuntu-latest
    needs: [test-user-registration]
    if: always()
    
    steps:
    - name: 下载测试报告
      uses: actions/download-artifact@v4
      with:
        name: user-registration-test-report
        path: test-reports/
        
    - name: 生成测试摘要
      run: |
        echo "# 测试结果汇总" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 用户注册功能测试" >> $GITHUB_STEP_SUMMARY
        echo "- 测试时间: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- 测试环境: Ubuntu Latest + MySQL 8.0 + JDK 17" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f test-reports/TEST-*.xml ]; then
          echo "✅ 测试报告已生成" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ 测试报告生成失败" >> $GITHUB_STEP_SUMMARY
        fi
